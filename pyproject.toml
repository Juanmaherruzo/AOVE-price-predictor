[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aove-price-predictor"
version = "0.3.0"
description = "Bimodal LSTM for weekly Extra Virgin Olive Oil origin price prediction"
authors = [{ name = "Juan Manuel Herruzo", email = "juanmherruzo@gmail.com" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "gunicorn>=22.0.0,<24.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "torch>=2.3.0,<3.0.0",
    "pandas>=2.2.0,<3.0.0",
    "numpy>=1.26.0,<3.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "matplotlib>=3.9.0,<4.0.0",
    "requests>=2.32.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "black>=24.0.0,<26.0.0",
    "ruff>=0.5.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
    "types-requests>=2.32.0,<3.0.0",
]

[project.scripts]
aove-cli = "aove.cli:main"
aove-train = "aove.training:main"
aove-prepare = "aove.data_prepare:main"
aove-benchmark = "aove.benchmark:main"

[project.urls]
Repository = "https://github.com/Juanmaherruzo/AOVE-price-predictor"

[tool.setuptools.packages.find]
where = ["."]
include = ["aove*"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, N naming, B bugbear (real bug
# patterns), C4 comprehensions, UP pyupgrade, RET returns, SIM simplify,
# RUF ruff-specific. B904 in particular catches `raise ... ` inside `except`
# without `from`, which loses the original traceback.
select = ["E", "F", "I", "N", "W", "B", "C4", "UP", "RET", "SIM", "RUF"]


# RUF001/RUF002: the docstrings use real MINUS SIGN and EN DASH in mathematical
# notation and citation ranges. That is intentional typography, not a typo.
ignore = ["RUF001", "RUF002"]

[tool.ruff.lint.per-file-ignores]
# Tests may assert on private state and shadow names for readability.
"tests/*" = ["SIM117"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# numpy's current stubs use PEP 695 `type` statements that mypy only parses
# under python_version >= 3.12; skip following them (treated as Any).
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.coverage.run]
source = ["aove"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
